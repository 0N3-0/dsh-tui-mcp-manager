name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify package contents
        run: npm pack --dry-run --cache .npm-cache
      - name: Smoke-test installed package
        run: pnpm smoke:package
      - name: Verify committed build artifacts
        run: git diff --exit-code -- lib/types
